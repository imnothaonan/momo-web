          description: 标题
          type: string
          example: 常用词汇
        brief:
          description: 简介
          type: string
          example: 常用
        tags:
          description: 标签
          type: array
          example:
            - 考研
          items:
            type: string
        list:
          description: 解析结果<br><br>引用自：[NotepadParsedItem](/schemas/NotepadParsedItem)
          type: array
          items:
            $ref: '#/components/schemas/NotepadParsedItem'

            PUBLISHED<br><br>引用自：[NotepadStatus](/schemas/NotepadStatus)
          type: object
          $ref: '#/components/schemas/NotepadStatus'
        content:
          description: |
            内容
            - 章节模式：以 `#` 开头，井号后是章节名称，下方是该章节的单词列表，一行一个
            - 文本模式：不以 `#` 开头，不限格式，会识别尽量多的单词和短语，开头添加 `//` 则还原单词原型后再提取
          type: string
          example: apple

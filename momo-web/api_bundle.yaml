openapi: 3.1.0
info:
  title: 墨墨开放 API
  version: v1
  description: >+
    # 说明

    1. 获取请求凭证，有两种方式获取
       1. 通过墨墨背单词 App：我的 -> 更多设置 -> 实验功能 -> 开放 API
       2. 点击[此处](https://open.maimemo.com/open/api/v1/tokens/openapi)获取
    2. 将请求凭证放在 `Authorization: Beraer XXX` 中，curl 示例如下：
        ```bash
        curl --request GET \
          --url https://open.maimemo.com/open/api/v1/phrases \
          --header 'Accept: application/json' \
          --header 'Authorization: Bearer xxx'
        ```

    ## 请求频控

    - 10 秒 20 次

    - 60 秒 40 次

    - 5 小时 2000 次（墨墨背单词）

    - 5 小时 8000 次（墨墨记忆卡）


    ## 墨墨记忆卡制卡指南


    Markji 也称“墨墨记忆卡”。本文用于编写可直接粘贴到
    Markji（墨墨记忆卡）中的内容。普通文字可以直接输入；需要挖空、样式、选择题、公式或媒体时，再使用对应语法。


    ### 目录


    - [先记住这些规则](#先记住这些规则)

    - [行内语法](#行内语法)
      - [文字样式](#文字样式)
      - [挖空](#挖空)
      - [音频](#音频)
      - [关联卡片](#关联卡片)
    - [块级语法](#块级语法)
      - [段落样式](#段落样式)
      - [选择题](#选择题)
      - [图片与画廊](#图片与画廊)
      - [独立公式](#独立公式)
      - [答案分隔线](#答案分隔线)
    - [转义与特殊字符](#转义与特殊字符)

    - [嵌套和位置限制](#嵌套和位置限制)

    - [完整示例](#完整示例)

    - [常见错误](#常见错误)

    - [输出前检查清单](#输出前检查清单)


    ### 先记住这些规则


    普通文字不需要任何标签：


    ```text

    光合作用把光能转化为化学能。

    ```


    需要语法时，通常使用下面的结构：


    ```text

    [名称#参数1,参数2#内容]

    ```


    请遵守以下约束：


    1. 标签和参数区分大小写。必须写成 `T`、`P`、`F`、`Choice`、`Pic`、`Audio`、`Card`、`E` 等规定形式。

    2. `#` 分隔名称、参数和内容。没有参数时也要保留两个 `#`，例如 `[E##x+y]`、`[Choice##...]`。

    3. 多个参数使用英文逗号 `,` 分隔；标签名、参数和分隔符之间不要加空格。

    4. 每个语法都必须有未被转义的右中括号 `]` 作为结尾。

    5. 普通换行会产生新段落。段落样式、选择题、图片、独立公式和答案分隔线应从一行的开头开始。

    6. 除明确允许的位置外，不要嵌套语法。

    7. 文字内容里需要显示普通中括号时，写成 `\[` 和 `\]`。

    8. 不要依赖错误语法被自动修复；无法确认时使用纯文本。


    一个常用的问答卡片：


    ```text

    [P#H1#光合作用]

    光合作用主要发生在哪种细胞器中？

    ---

    叶绿体。

    ```


    ### 行内语法


    行内语法可以和普通文字写在同一段中。


    #### 文字样式


    格式：


    ```text

    [T#参数#文字]

    ```


    可用参数：


    | 参数 | 效果 | 示例 |

    |---|---|---|

    | `B` | 加粗 | `[T#B#重点]` |

    | `I` | 斜体 | `[T#I#术语]` |

    | `U` | 下划线 | `[T#U#关键词]` |

    | `!rrggbb` | 文字颜色 | `[T#!e53935#红色文字]` |

    | `!!rrggbb` | 背景颜色 | `[T#!!fff59d#高亮文字]` |

    | `up` | 上标 | `x[T#up#2]` |

    | `down` | 下标 | `H[T#down#2]O` |

    | `link/"网址"` | 超链接 | `[T#link/"https://markji.com"#访问网站]` |


    多个样式可以组合：


    ```text

    [T#B,U,!e53935#红色加粗下划线]

    ```


    约束：


    - 颜色必须是 6 位小写十六进制字符，不要带 `#`，例如 `!0f0f0f`。

    - `up` 和 `down` 不要同时使用。

    - 同一种参数不要重复；多个颜色或多个对齐方式也不要冲突。

    - 链接网址必须放在英文双引号中。参数区里的 `#`、英文逗号和换行会破坏语法；网址含这些字符时，应在确认语义不变的前提下先做 URL 编码。

    - 样式内容中不要再放其他语法。


    #### 挖空


    格式：


    ```text

    [F#编号#要隐藏的内容]

    ```


    示例：


    ```text

    光合作用主要发生在[F#1#叶绿体]中。

    ```


    编号表示挖空分组：


    - 使用从 `1` 开始的正整数。

    - 相同编号属于同一组；希望一起显示或隐藏时使用相同编号。

    - 不同编号是不同组。

    - 不要省略编号，也不要使用 `0`、负数、小数或文字编号。

    - 挖空内容中不要嵌套其他语法；需要样式时，把样式放在挖空外部或改写内容。


    #### 音频


    格式：


    ```text

    [Audio#ID/音频ID#显示文字]

    ```


    常用参数：


    | 参数 | 含义 |

    |---|---|

    | `ID/音频ID` | 指定已有音频 |

    | `M` | 手动播放 |

    | `A` | 自动播放；不写 `M` 时也按自动播放处理 |

    | `D` | 播放行为跟随用户设置 |


    示例：


    ```text

    [Audio#M,ID/audio123#点击播放发音]

    [Audio#ID/audio123,D#单词发音]

    ```


    约束：


    - 只使用真实、已有的音频 ID，不要猜测或编造。

    - `M` 和 `A` 不要同时使用。需要手动播放时写 `M`；需要自动播放时可省略 `A`。

    - 显示文字可以为空，但仍要保留第二个 `#`。

    - 显示文字中不要嵌套其他语法。


    #### 卡片引用


    格式：


    ```text

    [Card#ID/卡片ID#显示文字]

    ```


    关联多张卡片时，用连字符 `-` 分隔 ID：


    ```text

    [Card#ID/abc123-def456#查看相关卡片]

    ```


    约束：


    - 只使用真实、已有的卡片 ID，不要猜测或编造。

    - ID 本身不能包含用作分隔符的连字符。

    - 重复 ID 没有意义，应在输出前去重；空 ID 应删除。

    - 显示文字中不要嵌套其他语法。


    ### 块级语法


    块级语法应从新一行的第一个字符开始。


    #### 段落样式


    格式：


    ```text

    [P#参数#段落内容]

    ```


    可用参数：


    | 参数 | 效果 | 示例 |

    |---|---|---|

    | `H1` | 标题 | `H1` |

    | `L` | 无序列表 | `L` |

    | `I<n>` | 缩进级别 | `I2` |

    | `left` | 左对齐 | `left` |

    | `center` | 居中 | `center` |

    | `right` | 右对齐 | `right` |


    示例：


    ```text

    [P#H1,center#细胞呼吸]

    [P#L#线粒体]

    ```


    约束：


    - 标题只支持 `H1`；不要使用其他标题级别。

    - `I<n>` 中的 `n` 使用正整数。

    - 一段只能选择一种对齐方式。

    - 当前仅使用 `L` 表示无序列表；不要生成有序列表、折叠、行内代码等未列出的参数。

    - 整个段落语法尽量写在同一行。

    - 段落内容可以包含文字样式、挖空、音频和关联卡片，但这些行内语法之间不要互相嵌套。

    - 普通段落不需要空参数的 `[P##内容]`，直接写文字即可。


    #### 选择题


    基本格式：


    ```text

    [Choice#参数#

    * 正确选项

    - 错误选项

    ]

    ```


    参数：


    | 参数 | 含义 |

    |---|---|

    | `fixed` | 保持选项顺序；省略时默认随机排列 |

    | `multi` | 多选题 |


    单选题示例：


    ```text

    [Choice#fixed#

    - 叶绿体

    * 线粒体

    - 核糖体

    ]

    ```


    多选题示例：


    ```text

    [Choice#multi#

    * 氧气

    * 水

    - 氯化钠

    ]

    ```


    约束：


    - `[Choice...` 必须从新一行开头开始，结尾的 `]` 单独占一行。

    - 每个选项也必须从新一行开始，并准确使用 `* ` 或 `- `（符号后有一个空格）。

    - `* ` 表示正确选项，`- ` 表示错误选项。

    - 有多个正确选项时必须加 `multi`；单选题只保留一个 `* `。

    - 希望固定顺序时加 `fixed`；希望随机排列时省略 `fixed`。

    - 选项内只使用普通文字和 `[T#...#...]` 文字样式。不要放挖空、音频、卡片关联、图片或公式。

    - 不要使用其他方式声明答案；以每行的 `* ` 和 `- ` 为准。


    #### 图片与画廊


    单张图片：


    ```text

    [Pic#ID/图片ID#]

    ```


    带遮罩的图片：


    ```text

    [Pic#ID/图片ID,MID/遮罩ID#]

    ```


    相邻且没有换行的多张图片会组成同一个画廊：


    ```text

    [Pic#ID/image1#][Pic#ID/image2,MID/mask2#]

    ```


    分别放在两行会形成两个独立的图片区块：


    ```text

    [Pic#ID/image1#]

    [Pic#ID/image2#]

    ```


    约束：


    - 图片语法必须从新一行开头开始。

    - 图片内容区必须为空，所以结尾是 `#]`。

    - 只使用真实、已有的图片 ID 和遮罩 ID，不要猜测或编造。

    - 需要同一画廊时不要在相邻图片之间加入空格或换行。


    #### 独立公式


    把公式单独放在一行，即可作为独立公式：


    ```text

    [E##E=mc^2]

    ```


    公式内容可以换行：


    ```text

    [E##\begin{aligned}

    a^2+b^2&=c^2

    \end{aligned}]

    ```


    独立公式的 `[E##` 必须从新一行开头开始，结束的 `]` 后不要在同一行追加普通文字。


    #### 答案分隔线


    使用三个半角连字符，并让它单独占一行：


    ```text

    ---

    ```


    常用于分隔问题和答案：


    ```text

    法国的首都是哪里？

    ---

    巴黎。

    ```


    不要在 `---` 前后添加空格、其他符号或同行文字。若答案分隔线位于卡片末尾，仍应保留它后面的换行。


    ### 转义与特殊字符


    在普通文字或语法的内容区中，需要显示中括号本身时进行转义：


    | 想显示 | 应输入 |

    |---|---|

    | `[` | `\[` |

    | `]` | `\]` |


    示例：


    ```text

    数学中的闭区间可以写作 \[a,b\]。

    [T#B#请阅读第 \[3\] 章]

    ```


    注意：


    - 只转义作为普通文字显示的中括号；真正的语法外层括号不要转义。

    - 内容区中的 `#` 和英文逗号通常可以直接写；参数区中的 `#`、英文逗号和换行具有结构含义，不能当普通字符使用。

    - 反斜杠只有紧挨中括号时才用于这里的转义。公式中的 LaTeX 反斜杠按公式原样书写。


    ### 嵌套和位置限制


    按下表决定一种语法能否放进另一种语法：


    | 容器 | 可放入的语法 |

    |---|---|

    | 普通段落 | `T`、`F`、`Audio`、`Card` |

    | `P` 段落 | `T`、`F`、`Audio`、`Card` |

    | `Choice` 选项 | 仅 `T` |

    | `T` 内容 | 不放其他语法 |

    | `F` 内容 | 不放其他语法 |

    | `Audio` 显示文字 | 不放其他语法 |

    | `Card` 显示文字 | 不放其他语法 |

    | `Pic` | 内容必须为空 |

    | `E` 公式 | 只写公式内容 |


    块级语法 `P`、`Choice`、`Pic`、独立 `E` 和 `---` 不要放进段落或其他语法内部。


    ### 完整示例


    #### 重点与挖空


    ```text

    [P#H1#细胞结构]

    [T#B#线粒体]是细胞进行[F#1#有氧呼吸]的主要场所。

    ---

    它常被称为细胞的“动力工厂”。

    ```


    #### 带公式的问答卡


    ```text

    勾股定理的公式是什么？

    ---

    [E##a^2+b^2=c^2]

    ```


    #### 固定顺序的多选题


    ```text

    以下哪些是哺乳动物？

    [Choice#fixed,multi#

    * 鲸

    - 鲨鱼

    * 蝙蝠

    - 企鹅

    ]

    ```


    ### 常见错误


    错误：少写一个 `#`。


    ```text

    [F#1挖空]

    ```


    正确：


    ```text

    [F#1#挖空]

    ```


    错误：块级语法前有普通文字。


    ```text

    题目：[Choice##

    * A

    - B

    ]

    ```


    正确：


    ```text

    题目：

    [Choice##

    * A

    - B

    ]

    ```


    错误：多选题漏掉 `multi`。


    ```text

    [Choice##

    * A

    * B

    - C

    ]

    ```


    正确：


    ```text

    [Choice#multi#

    * A

    * B

    - C

    ]

    ```


    错误：选项符号后没有空格。


    ```text

    *正确选项

    ```


    正确：


    ```text

    * 正确选项

    ```


    错误：普通右中括号未转义。


    ```text

    [T#B#区间 [0,1]]

    ```


    正确：


    ```text

    [T#B#区间 \[0,1\]]

    ```


    ### 输出前检查清单


    1. 是否所有标签和参数都使用规定的大小写？

    2. 是否每个语法都有两个结构分隔 `#`，并有正确的结尾 `]`？

    3. 是否所有块级语法都从新一行的第一个字符开始？

    4. 是否每个选择题选项都使用准确的 `* ` 或 `- ` 前缀？

    5. 是否多选题写了 `multi`，需要固定顺序时写了 `fixed`？

    6. 是否所有挖空都使用正整数编号，且分组符合预期？

    7. 是否普通文字中的 `[` 和 `]` 已写成 `\[` 和 `\]`？

    8. 是否没有在不支持的位置嵌套语法？

    9. 是否所有标题都只使用 `H1`？

    10. 是否所有颜色都是 6 位小写十六进制字符？

    11. 是否没有编造图片、遮罩、音频或关联卡片 ID？

    12. 是否避免了未列出的参数和不必要的复杂样式？

paths:
  /api/v1/markji/decks/folders:
    servers: &ref_0
      - url: https://open.maimemo.com/open
        description: 生产服务
      - url: https://open-dev.maimemo.com/open
        description: 测试服务
    get:
      tags:
        - 内容
        - 墨墨记忆卡
      operationId: maimemo.openapi.markji.v1.MarkjiContentService.ListFolders
      summary: 获取文件夹列表
      requestBody: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: 暂无文档
                properties:
                  folders:
                    description: <br><br>引用自：[MarkjiFolder](/schemas/MarkjiFolder)
                    type: array
                    items:
                      $ref: '#/components/schemas/MarkjiFolder'
                required:
                  - folders
      parameters: []
      security:
        - user:
            - ''
  /api/v1/markji/decks:
    servers: *ref_0
    get:
      tags:
        - 内容
        - 墨墨记忆卡
      operationId: maimemo.openapi.markji.v1.MarkjiContentService.ListDecks
      summary: 获取我的牌组列表
      requestBody: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: 暂无文档
                properties:
                  decks:
                    description: <br><br>引用自：[MarkjiDeck](/schemas/MarkjiDeck)
                    type: array
                    items:
                      $ref: '#/components/schemas/MarkjiDeck'
                  total:
                    description: 总数
                    type: integer
                    example: null
                required:
                  - decks
                  - total
      parameters:
        - name: offset
          in: query
          deprecated: false
          required: false
          description: 偏移量
          schema:
            description: 偏移量
            type: integer
            example: null
        - name: limit
          in: query
          deprecated: false
          required: false
          description: 每页数量
          schema:
            description: 每页数量
            type: integer
            example: null
        - name: folder_id
          in: query
          deprecated: false
          required: false
          description: 文件夹 OpenAPI ID
          schema:
            description: 文件夹 OpenAPI ID
            type: string
            example: null
        - name: source
          in: query
          deprecated: false
          required: false
          description: 牌组来源<br><br>引用自：[MarkjiSource](/schemas/MarkjiSource)
          schema:
            description: 牌组来源<br><br>引用自：[MarkjiSource](/schemas/MarkjiSource)
            type: object
            $ref: '#/components/schemas/MarkjiSource'
      security:
        - user:
            - ''
  /api/v1/markji/decks/{deck}:
    servers: *ref_0
    get:
      tags:
        - 内容
        - 墨墨记忆卡
      operationId: maimemo.openapi.markji.v1.MarkjiContentService.GetDeck
      summary: 获取牌组信息
      requestBody: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: 暂无文档
                properties:
                  deck:
                    description: null<br><br>引用自：[MarkjiDeck](/schemas/MarkjiDeck)
                    type: object
                    $ref: '#/components/schemas/MarkjiDeck'
                required:
                  - deck
      parameters:
        - name: deck
          in: path
          deprecated: false
          required: true
          description: 牌组 OpenAPI ID
          schema:
            description: 牌组 OpenAPI ID
            type: string
            example: null
        - name: with_root
          in: query
          deprecated: false
          required: false
          description: 是否返回根牌组信息
          schema:
            description: 是否返回根牌组信息
            type: boolean
            example: false
      security:
        - user:
            - ''
  /api/v1/markji/decks/{deck}/chapters:
    servers: *ref_0
    get:
      tags:
        - 内容
        - 墨墨记忆卡
      operationId: maimemo.openapi.markji.v1.MarkjiContentService.ListChapters
      summary: 获取牌组章节
      requestBody: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: 暂无文档
                properties:
                  chapterset:
                    description: >-
                      null<br><br>引用自：[MarkjiChapterset](/schemas/MarkjiChapterset)
                    type: object
                    $ref: '#/components/schemas/MarkjiChapterset'
                  chapters:
                    description: <br><br>引用自：[MarkjiChapter](/schemas/MarkjiChapter)
                    type: array
                    items:
                      $ref: '#/components/schemas/MarkjiChapter'
                  cards:
                    description: <br><br>引用自：[MarkjiCard](/schemas/MarkjiCard)
                    type: array
                    items:
                      $ref: '#/components/schemas/MarkjiCard'
                required:
                  - chapters
      parameters:
        - name: deck
          in: path
          deprecated: false
          required: true
          description: 牌组 OpenAPI ID
          schema:

            ISO 8601 格式
          type: string
          format: ISODate
          example: 2023-03-13T16:00:00.000Z
        updated_time:
          description: |-
            更新时间
            ISO 8601 格式
          type: string
          format: ISODate
          example: 2023-03-13T16:00:00.000Z
